name: Scan deals & deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3,9,15,21 * * *'   # every 6 hours (first run ~4:23am Eastern)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  scan-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan dispensary sites
        if: github.event_name != 'push' || contains(github.event.head_commit.message, 'regions')
        run: node scraper/scrape.mjs
      - name: Save results
        if: github.event_name != 'push' || contains(github.event.head_commit.message, 'regions')
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add data/deals.json
          git diff --cached --quiet || (git commit -m "Update deals [skip ci]" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
